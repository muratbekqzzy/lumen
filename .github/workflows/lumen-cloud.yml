name: Publish Lumen
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'web/**'
      - 'cloud/**'
      - '.github/workflows/lumen-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript
        run: |
          node --check cloud/cloud.js
          node --check cloud/migrate.js
          node --test cloud/*.test.cjs
          node --test hosted/*.test.mjs
          node --check cloud/panopto.js
          python -m unittest discover -s cloud -p '*_test.py' -v
          python -m py_compile tools/panopto_from_link.py
          node --check web/aura.js
          node --check web/app.js
          node --check web/graph.js
          node --check web/pdf.js
          node --check web/import.js
          node --check web/tutor.js
      - name: Assemble static site
        run: |
          mkdir -p _site/web _site/cloud
          cp index.html manifest.webmanifest sw.js _site/
          cp -R web/pdfjs _site/web/
          cp web/app.js web/import.js web/pdf.js web/tutor.js web/markdown.js web/aura.js web/force.js web/graph.js web/style.css web/icon.svg web/spss.html _site/web/
          cp cloud/cloud.js cloud/panopto.js cloud/hosting.js cloud/migrate.js _site/cloud/
          touch _site/.nojekyll
          python cloud/check_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
